{% extends "layout.html" %}
{% block title %}Log a set{% endblock %}
{% block main %}
    <form action="/log" method="post">
        <h2>Log a set</h2>
        <p>
            <label for="exercise_id">Exercise:</label>
            <select name="exercise_id" id="exercise_id" required>
                <option value="" disabled selected>Choose an exercise</option>
                {% for exercise in exercises %}
                    <option value="{{exercise.exercise_id}}">{{exercise.exercise_name}}</option>
                {% endfor %}
            </select> 
        </p>

        <p>
            <label for="weight">Weight (Kg):</label>
            <input type="number" id="weight" name="weight" min="0" step="0.5" required>
        </p>

        <p>
            <label for="reps">Repetitions:</label>
            <input type="number" id="reps" name="reps" min="1" step="1" required>
        </p>
        
        <button type="submit">Save set</button> 
        
    </form>
{% endblock %}
